name: japonkale
description: "Japon Kale - İzmir halı saha maç ve kaleci bulma uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Veritabanı (Supabase)
  supabase_flutter: ^2.3.4
  
  # Google ile Giriş
  google_sign_in: ^6.2.1

  # State Management (Durum Yönetimi)
  flutter_riverpod: ^2.5.1

  # Push bildirimi (Firebase Cloud Messaging)
  # firebase_core her Firebase paketinin ön koşulu.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # FCM, uygulama ÖN PLANDAYKEN sistem bildirimi göstermez; o durumda
  # bildirimi biz çiziyoruz.
  flutter_local_notifications: ^18.0.1

  # Yardımcı Paketler (Telefon Arama, Tarih & Ayarlar)
  url_launcher: ^6.2.5
  intl: 0.20.3
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Uygulama ikonlarini tek kaynaktan uretir (assets/icon/app_icon.png).
  flutter_launcher_icons: ^0.14.1

# Ikon uretimi:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Android 8+ uyarlanabilir ikon: yesil zemin + ortada top.
  adaptive_icon_background: "#0B6B3A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/