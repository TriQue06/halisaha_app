# =====================================================================
# Codemagic — iOS derleme ve TestFlight yükleme
#
# Mac gerekmez: Codemagic buluttaki Mac'te derler, imzalar ve yükler.
#
# Codemagic panelinde bir kez yapılacaklar:
#  1. Teams → Integrations → Developer Portal: App Store Connect API
#     anahtarını ekle; adını aşağıdaki "app_store_connect" değeriyle AYNI yap.
#  2. Uygulama → Environment variables → "ios_config" grubuna ekle:
#       GOOGLE_IOS_CLIENT_ID       166383252757-xxxx.apps.googleusercontent.com
#       GOOGLE_REVERSED_CLIENT_ID  com.googleusercontent.apps.166383252757-xxxx
#       FIREBASE_IOS_API_KEY       GoogleService-Info.plist → API_KEY
#       FIREBASE_IOS_APP_ID        GoogleService-Info.plist → GOOGLE_APP_ID
#       APP_STORE_APPLE_ID         App Store Connect → Uygulama → Apple ID (sayı)
#     Hiçbiri gizli değil; değişince kod commit'i gerekmesin diye burada.
#  3. Aynı ekranda "ios_signing" grubuna ekle (hepsini "Secure" işaretle):
#       APP_STORE_CONNECT_ISSUER_ID       App Store Connect → Users and Access →
#                                         Integrations → Issuer ID
#       APP_STORE_CONNECT_KEY_IDENTIFIER  aynı sayfadaki API anahtarının Key ID'si
#       APP_STORE_CONNECT_PRIVATE_KEY     o anahtarın .p8 dosyasının tam içeriği
#       CERTIFICATE_PRIVATE_KEY           dağıtım sertifikasının RSA özel anahtarı;
#                                         bir kez üretilir:
#                                         ssh-keygen -t rsa -b 2048 -m PEM -f cert_key
#                                         (parola sorunca iki kez Enter) → cert_key
#                                         dosyasının tam içeriği
#
# İmzalama tamamen otomatik: sertifika ve App Store profili her derlemede
# Apple'dan çekilir, yoksa oluşturulur. Codemagic panelinde elle profil
# yüklemek GEREKMEZ.
# =====================================================================

workflows:
  ios-release:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: JaponKale ASC

    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      groups:
        - ios_config
        - ios_signing

    scripts:
      - name: Bağımlılıklar
        script: flutter pub get

      - name: Google iOS URL şeması
        script: |
          sed -i '' "s/^GOOGLE_REVERSED_CLIENT_ID=.*/GOOGLE_REVERSED_CLIENT_ID=${GOOGLE_REVERSED_CLIENT_ID}/" ios/Flutter/AppConfig.xcconfig
          grep GOOGLE_REVERSED_CLIENT_ID ios/Flutter/AppConfig.xcconfig

      - name: İmzalama (sertifika + App Store profili)
        script: |
          keychain initialize
          # Profil yoksa oluşturur; varsa ve geçerliyse onu kullanır.
          app-store-connect fetch-signing-files "com.japonkale.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: IPA derle
        script: |
          # TestFlight'taki son build numarasının bir fazlası; ilk yüklemede 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "${APP_STORE_APPLE_ID}" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID} \
            --dart-define=FIREBASE_IOS_API_KEY=${FIREBASE_IOS_API_KEY} \
            --dart-define=FIREBASE_IOS_APP_ID=${FIREBASE_IOS_APP_ID}

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
